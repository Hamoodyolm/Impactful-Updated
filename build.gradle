plugins {
	id 'fabric-loom' version '1.14.6'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url "https://maven.terraformersmc.com/releases" }
	maven {
		name = "TarsosDSP"
		url = "https://mvn.0110.be/releases"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation "be.tarsos.dsp:core:2.5"
	include "be.tarsos.dsp:core:2.5"
	implementation "be.tarsos.dsp:jvm:2.5"
	include "be.tarsos.dsp:jvm:2.5"

	include(implementation("com.googlecode.soundlibs:vorbisspi:1.0.3.3"))
	include(implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4"))
	include(implementation("com.googlecode.soundlibs:jorbis:0.0.17.4"))
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}